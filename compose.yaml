services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    environment:
      PORT: "8787"
      TRUST_CADDY_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/docker-airwaves-entrypoint.sh"]
    command: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: airwaves
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
      - postgres_app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-entrypoint.sh:/docker-airwaves-entrypoint.sh:ro
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-airwaves.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d airwaves"]
      interval: 5s
      timeout: 4s
      retries: 20
secrets:
  postgres_admin_password:
    file: ./secrets/postgres-admin-password
  postgres_app_password:
    file: ./secrets/postgres-app-password
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
